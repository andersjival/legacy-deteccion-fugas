name = "legacy-deteccion-fugas"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Configuración de Base de Datos Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "legacy-fugas-db"
database_id = "ace95c8a-7891-420e-a8f9-f84ecef59f8e"

# Configuración de Almacenamiento Cloudflare R2
# Descomentar una vez creado el bucket 'legacy-fugas-photos' en el dashboard de Cloudflare:
# [[r2_buckets]]
# binding = "PHOTOS_BUCKET"
# bucket_name = "legacy-fugas-photos"

# Variables de Entorno
[vars]
ENVIRONMENT = "production"
ADMIN_PIN = "1234"

